<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chapter 1: Pre-Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans">

  <!-- Header -->
  <header class="flex justify-between items-center p-5 border-b border-gray-600">
    <a href="index.html" class="text-3xl font-bold cursor-pointer hover:text-gray-400 transition">TECHTURE</a>
  </header>

  <!-- Pre-Test Section -->
  <main class="max-w-lg mx-auto mt-10">
    <h2 class="text-lg font-semibold bg-gray-700 p-3 rounded-md inline-block">POST-TEST</h2>

    <!-- Questions -->
    <form id="preTestForm" class="mt-6 space-y-6">
      <!-- Question 5 -->
      <div class="bg-gray-600 p-4 rounded-md">
        <label class="block text-lg font-semibold">1. Which command deletes a file in Command Prompt?</label>
        <select class="w-full mt-2 p-2 rounded-md bg-white text-black" name="q1">
          <option value="">Select Answer</option>
          <option value="A">A. del</option>
          <option value="B">B. erase</option>
          <option value="C">C. remove</option>
        </select>
      </div>
      <!-- Question 3 -->
      <div class="bg-gray-600 p-4 rounded-md">
        <label class="block text-lg font-semibold">2. Which command provides a detailed summary of the system configuration?</label>
        <select class="w-full mt-2 p-2 rounded-md bg-white text-black" name="q2">
          <option value="">Select Answer</option>
          <option value="A">A. ipconfig</option>
          <option value="B">B. systeminfo</option>
          <option value="C">C. config /all</option>
        </select>
      </div>
      <!-- Question 1 -->
      <div class="bg-gray-600 p-4 rounded-md">
        <label class="block text-lg font-semibold">3. How do you open the Command Prompt in Windows?</label>
        <select class="w-full mt-2 p-2 rounded-md bg-white text-black" name="q3">
          <option value="">Select Answer</option>
          <option value="A">A. Press Win + R and type cmd.</option>
          <option value="B">B. Press Ctrl + Alt + Del and choose CMD.</option>
          <option value="C">C. Right-click on the desktop and select CMD.</option>
        </select>
      </div>
      <!-- Question 6 -->
      <div class="bg-gray-600 p-4 rounded-md">
        <label class="block text-lg font-semibold">4. What command lists all user accounts on the computer?</label>
        <select class="w-full mt-2 p-2 rounded-md bg-white text-black" name="q4">
          <option value="">Select Answer</option>
          <option value="A">A. net user</option>
          <option value="B">B. userlist</option>
          <option value="C">C. account show</option>
        </select>
      </div>
      <!-- Question 8 -->
      <div class="bg-gray-600 p-4 rounded-md">
        <label class="block text-lg font-semibold">5. Which command clears all the text from the CMD window?</label>
        <select class="w-full mt-2 p-2 rounded-md bg-white text-black" name="q5">
          <option value="">Select Answer</option>
          <option value="A">A. clear</option>
          <option value="B">B. cls</option>
          <option value="C">C. wipe</option>
        </select>
      </div>
      <!-- Question 4 -->
      <div class="bg-gray-600 p-4 rounded-md">
        <label class="block text-lg font-semibold">6. What command is used to list files and directories in the current folder?</label>
        <select class="w-full mt-2 p-2 rounded-md bg-white text-black" name="q6">
          <option value="">Select Answer</option>
          <option value="A">A. dir</option>
          <option value="B">B. list</option>
          <option value="C">C. ls</option>
        </select>
      </div>
      <!-- Question 10 -->
      <div class="bg-gray-600 p-4 rounded-md">
        <label class="block text-lg font-semibold">7. Which command shows a visual tree of all files and folders?</label>
        <select class="w-full mt-2 p-2 rounded-md bg-white text-black" name="q7">
          <option value="">Select Answer</option>
          <option value="A">A. structure /v</option>
          <option value="B">B. tree /f</option>
          <option value="C">C. folderlist</option>
        </select>
      </div>
      <!-- Question 2 -->
      <div class="bg-gray-600 p-4 rounded-md">
        <label class="block text-lg font-semibold">8. Which command checks and repairs corrupted system files?</label>
        <select class="w-full mt-2 p-2 rounded-md bg-white text-black" name="q8">
          <option value="">Select Answer</option>
          <option value="A">A. chkdsk</option>
          <option value="B">B. sfc /scannow</option>
          <option value="C">C. net check</option>
        </select>
      </div>
      <!-- Question 7 -->
      <div class="bg-gray-600 p-4 rounded-md">
        <label class="block text-lg font-semibold">9. How do you rename a file using CMD?</label>
        <select class="w-full mt-2 p-2 rounded-md bg-white text-black" name="q9">
          <option value="">Select Answer</option>
          <option value="A">A. ren oldname.txt newname.txt</option>
          <option value="B">B. mv oldname.txt newname.txt</option>
          <option value="C">C. namechange oldname.txt newname.txt</option>
        </select>
      </div>
      <!-- Question 9 -->
      <div class="bg-gray-600 p-4 rounded-md">
        <label class="block text-lg font-semibold">10. Which command displays the full path of a file found in system PATH?</label>
        <select class="w-full mt-2 p-2 rounded-md bg-white text-black" name="q10">
          <option value="">Select Answer</option>
          <option value="A">A. find</option>
          <option value="B">B. where</option>
          <option value="C">C. path</option>
        </select>
      </div>
    </form>

    <!-- Progress & Finish Button -->
    <div id="finishContainer" class="flex justify-between items-center mt-6 p-3 bg-gray-800 rounded-md">
      <button class="bg-red-600 px-5 py-2 rounded-md font-semibold hover:bg-red-500 transition" onclick="finishTest()">Finish Attempt</button>
    </div>

    <!-- Score Display (Hidden Initially) -->
    <div id="scoreContainer" class="hidden flex flex-col items-center mt-10">
      <div class="bg-gray-500 p-6 text-2xl font-bold rounded-md" id="scoreDisplay">SCORE: 0/10</div>
      <button class="bg-gray-500 px-6 py-3 mt-4 rounded-md font-semibold hover:bg-gray-400 transition" onclick="proceedToChapter2()">Proceed</button>
    </div>
  </main>

  <script>
    function finishTest() {
      const answers = {
        q1: "A",
        q2: "B",
        q3: "A",
        q4: "A",
        q5: "B",
        q6: "A",
        q7: "B",
        q8: "B",
        q9: "A",
        q10: "B"
      };

      let score = 0;
      const form = document.getElementById("preTestForm");
      const formData = new FormData(form);

      for (let key in answers) {
        if (formData.get(key)?.trim() === answers[key]) {
          score++;
        }
      }

      document.getElementById("scoreDisplay").textContent = `SCORE: ${score}/10`;
      document.getElementById("scoreContainer").classList.remove("hidden");
      document.getElementById("finishContainer").classList.add("hidden");
    }

    function proceedToChapter2() {
      window.location.href = "YEY.html";
    }
  </script>
</body>
</html>
